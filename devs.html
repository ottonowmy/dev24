<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annuaire — Ottonowmy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">Ottonowmy</a>
    <div class="nav-links">
      <a href="devs.html" class="active">Annuaire</a>
      <a href="inscription.html" class="btn-nav">Je suis dev</a>
    </div>
  </nav>

  <div class="page-header">
    <h1>Les développeurs bénévoles</h1>
    <p>Cliquez sur un profil pour découvrir la touche perso et prendre contact.</p>
  </div>

  <main class="annuaire-main">
    <div class="container">

      <!-- Recherche uniquement par texte libre -->
      <div class="filters-bar">
        <div class="search-wrap">
          <span class="search-icon">&#8981;</span>
          <input type="text" id="search" placeholder="Rechercher par nom, technologie, accroche…" />
        </div>
        <span class="filter-count" id="filter-count"></span>
      </div>

      <div class="ann-label">Les plus consultés</div>
      <div id="top-devs" class="devs-top"></div>

      <div class="ann-label" style="margin-top:44px">Tous les bénévoles</div>
      <div id="devs-grid" class="devs-grid"></div>

      <div id="loading" class="loading-state">Chargement en cours…</div>
      <div id="empty" class="empty-state" style="display:none">
        Aucun développeur trouvé.
        <a href="inscription.html">Soyez le premier à vous inscrire.</a>
      </div>

    </div>
  </main>

  <nav class="nav">
    <a href="index.html" class="nav-logo">Ottonowmy</a>
    <div class="nav-links">
      <a href="devs.html">Annuaire</a>
      <a href="inscription.html" class="btn-nav">Rejoindre</a>
    </div>
  </nav>

  <script>
    let allDevs = [];

    async function loadDevs() {
      const loadingEl = document.getElementById('loading');
      try {
        const res = await fetch('/api/devs-list');
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `Erreur ${res.status}`);
        }
        const records = await res.json();
        if (records.error) throw new Error(records.error);
        allDevs = Array.isArray(records) ? records : [];
        loadingEl.style.display = 'none';
        // Top = les 3 avec le plus de vues
        const sorted = [...allDevs].sort((a,b) => (b.fields?.['Vues']||0) - (a.fields?.['Vues']||0));
        renderTop(sorted.slice(0, 3));
        renderDevs(allDevs);
        updateCount(allDevs.length);
      } catch (err) {
        loadingEl.textContent = `Impossible de charger : ${err.message}`;
        loadingEl.style.color = '#c0392b';
      }
    }

    function initials(name) {
      if (!name) return '?';
      return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
    }

    function devCard(r, top = false) {
      const f        = r.fields || {};
      const name     = f['Nom'] || 'Développeur';
      const accroche = f['Accroche'] || f['Touche perso'] || '';
      const vues     = f['Vues']  || 0;
      const stars    = f['Stars'] || 0;
      const photo    = f['Photo'];

      const avatar = photo
        ? `<img src="${photo}" alt="${name}" class="dev-avatar" />`
        : `<div class="dev-avatar">${initials(name)}</div>`;

      return `
        <a href="profil.html?id=${r.id}" class="dev-card ${top ? 'dev-card-top' : ''}">
          ${top ? '<div class="top-tag">Populaire</div>' : ''}
          <div class="dev-card-header">
            ${avatar}
            <div class="dev-info">
              <div class="dev-name">${name}</div>
            </div>
          </div>
          ${accroche ? `<p class="dev-accroche">"${accroche.slice(0,100)}${accroche.length>100?'…':''}"</p>` : ''}
          <div class="dev-card-stats">
            <span class="dev-stat">◎ ${vues} vue${vues>1?'s':''}</span>
            <span class="dev-stat">★ ${stars} étoile${stars>1?'s':''}</span>
            <span class="dev-voir">Voir le profil →</span>
          </div>
        </a>`;
    }

    function renderTop(devs) {
      document.getElementById('top-devs').innerHTML = devs.length
        ? devs.map(r => devCard(r, true)).join('')
        : '<p style="color:var(--ink4);font-size:.85rem;font-weight:300">Aucun profil pour le moment.</p>';
    }

    function renderDevs(devs) {
      const el    = document.getElementById('devs-grid');
      const empty = document.getElementById('empty');
      if (!devs.length) { el.innerHTML = ''; empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      el.innerHTML = devs.map(r => devCard(r)).join('');
    }

    function updateCount(n) {
      document.getElementById('filter-count').textContent =
        n > 0 ? `${n} profil${n > 1 ? 's' : ''}` : '';
    }

    document.getElementById('search').addEventListener('input', function() {
      const q = this.value.toLowerCase().trim();
      if (!q) { renderDevs(allDevs); updateCount(allDevs.length); return; }
      const filtered = allDevs.filter(r => {
        const f = r.fields || {};
        return [
          f['Nom'] || '',
          f['Accroche'] || '',
          f['Touche perso'] || '',
          ...(f['Technologies'] || [])
        ].join(' ').toLowerCase().includes(q);
      });
      renderDevs(filtered);
      updateCount(filtered.length);
    });

    loadDevs();
  </script>
</body>
</html>
